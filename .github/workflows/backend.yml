name: Backend
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sigg_test
          POSTGRES_DB: sigg_test
          # Isolated ephemeral CI service; no production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sigg_test -d sigg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend tests scripts
      - run: python -m ruff format --check backend tests scripts
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml
      - name: Test PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sigg_test@localhost:5432/sigg_test
        run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml
