[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/wsgi.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
